[build-system]
build-backend = 'mesonpy'
requires = ["meson>=0.63.0",
            "meson-python",
            "setuptools_scm>=6.2",
            "numpy>=2.0.0"]

[project]
name = "radbelt"
description = "Astropy-friendly wrapper for the AE-8/AP-8 Van Allen belt model"
readme = "README.md"
authors = [ { name = "Leo Singer", email = "leo.p.singer@nasa.gov" } ]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy"
]
license = { text = "NOSA" }
requires-python = ">=3.9"
dependencies = ["astropy", "numpy>=1.19"]
dynamic = [ "version" ]

[project.urls]
source = "https://github.com/nasa/radbelt"

[project.optional-dependencies]
test = ["pytest-doctestplus"]

[tool.cibuildwheel]
test-extras = ["test"]
test-command = "pytest --pyargs radbelt --doctest-plus"
skip = [
    # Skip musllinux wheels, which take a long time to build because Numpy must be built from source
    "*musllinux*",
    # Skip PyPy wheels
    "pp*",
    # Skip 32-bit Intel wheels
    "*_i686"
]

[tool.cibuildwheel.linux]
# Build Linux wheels for aarch64 under emulation.
archs = ["auto", "aarch64"]

[tool.cibuildwheel.windows]
archs = ["amd64"]
before-build = "pip install delvewheel"
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
environment.FC = "gfortran-14"

[[tool.cibuildwheel.overrides]]
# macOS arm64 wheels are built on GitHub on macOS 12; set deployment target accordingly
select = "*macosx_x86_64"
inherit.environment = "append"
environment.MACOSX_DEPLOYMENT_TARGET = "12.0"

[[tool.cibuildwheel.overrides]]
# macOS arm64 wheels are built on GitHub on macOS 14; set deployment target accordingly
select = "*macosx_arm64"
inherit.environment = "append"
environment.MACOSX_DEPLOYMENT_TARGET = "14.0"
